<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk Escolar - Chamados</title>
    <meta name="theme-color" content="#1B2430">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
    <script src="JS/tema.js"></script>
    <script src="JS/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="JS/auth.js"></script>
    <script src="pwa.js" defer></script>

    <script src="JS/storage.js" defer></script>
    <script src="chamados.js" defer></script>
</head>
<body>
    <header class="topo">
        <div class="topo-conteudo">
            <span class="topo-marca">HelpDesk Escolar</span>

            <div class="topo-direita">
                <nav class="topo-nav">
                <a href="index.html">Abrir Chamado</a>
                <a href="chamados.html" class="ativo">Ver Chamados</a>
            </nav>
                <button type="button" id="botao-tema" class="botao-tema" aria-label="Mudar para modo escuro" title="Mudar para modo escuro">🌙</button>
            </div>
        </div>
    </header>

    <main class="conteudo conteudo-larga">

        <div class="cabecalho-lista">
            <div>
                <h1>Chamados registrados</h1>

                <p class="subtitulo">
                    Acompanhe, filtre e atualize o status dos chamados.
                </p>
            </div>

            <div class="campo campo-filtro">
                <label for="filtro-status">Filtrar por status</label>

                <select id="filtro-status">
                    <option value="Todos">Todos</option>
                    <option value="Aberto">Aberto</option>
                    <option value="Em andamento">Em andamento</option>
                    <option value="Resolvido">Resolvido</option>
                </select>
            </div>
        </div>

        <div id="lista-chamados" class="lista-chamados"></div>

        <p id="mensagem-vazia" class="mensagem-vazia" hidden>
            Nenhum chamado encontrado para esse filtro.
        </p>

    </main>
</body>
</html>
