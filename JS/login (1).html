<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk Escolar - Entrar</title>
    <meta name="theme-color" content="#1B2430">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
    <script src="JS/tema.js"></script>
    <script src="JS/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="JS/auth.js"></script>
    <script src="pwa.js" defer></script>
    <script src="login.js" defer></script>
</head>
<body>
    <header class="topo">
        <div class="topo-conteudo">
            <span class="topo-marca">HelpDesk Escolar</span>

            <div class="topo-direita">
                <button type="button" id="botao-tema" class="botao-tema" aria-label="Mudar para modo escuro" title="Mudar para modo escuro">🌙</button>
            </div>
        </div>
    </header>

    <main class="conteudo">
        <div class="cartao">

            <div class="abas-login" role="tablist">
                <button type="button" id="aba-entrar" class="aba ativa" role="tab" aria-selected="true">Entrar</button>
                <button type="button" id="aba-cadastrar" class="aba" role="tab" aria-selected="false">Criar conta</button>
            </div>

            <!-- Entrar -->
            <form id="form-entrar">
                <h1>Entrar</h1>
                <p class="subtitulo">Use seu nome de usuário e senha.</p>

                <div class="campo">
                    <label for="entrar-usuario">Nome de usuário</label>
                    <input type="text" id="entrar-usuario" autocomplete="username" required>
                </div>

                <div class="campo">
                    <label for="entrar-senha">Senha</label>
                    <input type="password" id="entrar-senha" autocomplete="current-password" required>
                </div>

                <button type="submit" class="botao-principal">Entrar</button>
                <p id="mensagem-entrar" class="mensagem-status" role="alert"></p>
            </form>

            <!-- Criar conta -->
            <form id="form-cadastrar" hidden>
                <h1>Criar conta</h1>
                <p class="subtitulo">Escolha seu perfil. A Direção precisa informar o código da administração.</p>

                <div class="campo">
                    <label for="cad-usuario">Nome de usuário</label>
                    <input type="text" id="cad-usuario" autocomplete="username" minlength="3" required>
                </div>

                <div class="campo">
                    <label for="cad-senha">Senha (mínimo 6 caracteres)</label>
                    <input type="password" id="cad-senha" autocomplete="new-password" minlength="6" required>
                </div>

                <div class="campo">
                    <label for="cad-perfil">Perfil</label>
                    <select id="cad-perfil" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="Aluno">Aluno</option>
                        <option value="Professor">Professor</option>
                        <option value="Direção">Direção (Administração)</option>
                    </select>
                </div>

                <div class="campo" id="campo-codigo" hidden>
                    <label for="cad-codigo">Código da Direção</label>
                    <input type="password" id="cad-codigo" autocomplete="off">
                </div>

                <button type="submit" class="botao-principal">Criar conta</button>
                <p id="mensagem-cadastrar" class="mensagem-status" role="alert"></p>
            </form>

        </div>
    </main>
</body>
</html>
